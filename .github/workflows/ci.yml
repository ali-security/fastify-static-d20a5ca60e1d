name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional borp test file glob; empty runs the full suite'
        required: false
        default: ''
        type: string

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
    cancel-in-progress: true

permissions:
  contents: read

# Inlined from fastify/workflows/.github/workflows/plugins-ci.yml@v5 (+ nested-quality.yml)
# with license-check: true, lint: true, because a reusable-workflow caller job cannot
# declare timeout-minutes.
jobs:
  license-check:
    name: Check Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Check Licenses
        run: npx license-checker --production --summary --onlyAllow="0BSD;Apache-2.0;BlueOak-1.0.0;BSD-2-Clause;BSD-3-Clause;ISC;MIT;"

  linter:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Lint code
        run: npm run lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm i --ignore-scripts

      # `npm test` inlined (test:unit && test:typescript) with borp's per-file timeout
      # raised from 30s: test/static.test.js legitimately takes >30s on macOS runners.
      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx borp --timeout 180000 ${{ inputs.test-filter }}
          else
            npx borp -C --check-coverage --lines 100 --timeout 180000 && npm run test:typescript
          fi

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Pack
        run: |
          npm i -g npm@11.6.2
          npm pack
          mv fastify-static-9.0.0.tgz static-9.0.0.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: static-9.0.0
          path: static-9.0.0.tgz
          if-no-files-found: error
